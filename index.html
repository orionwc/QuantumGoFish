                      : 'bg-rose-950/70 border-rose-500'
                  }`}
                >
                  <div className="flex items-start gap-3">
                    <span className="text-3xl">{gameState.result.won ? '🏆' : '💥'}</span>
                    <div>
                      <h2 className="text-xl sm:text-2xl font-extrabold text-white">
                        {gameState.result.title}
                      </h2>
                      <p className="text-sm text-slate-200 mt-1">{gameState.result.reason}</p>
                    </div>
                  </div>

                  {gameState.result.counterExample &&
                    renderCounterExampleGrid(gameState.result.counterExample)}

                  <button
                    type="button"
                    onClick={() => {
                      const restarted = createInitialState(
                        gameState.players.map((p) => p.name),
                        gameState.mode
                      );
                      applySyncedState(restarted, null, 'MAIN');
                    }}
                    className="px-6 py-3 rounded-xl bg-white text-slate-950 font-bold text-sm hover:bg-slate-200 transition"
                  >
                    Play Again With Same Players
                  </button>
                </div>
              )}

              {/* Action Controls Panel */}
              {gameState.status === 'PLAYING' && (
                <div className="bg-slate-900/95 border border-slate-800 rounded-2xl p-5 shadow-xl">
                  {!isMyTurnOnline ? (
                    <div className="text-center py-4 text-sm text-slate-400">
                      Waiting for <strong className="text-white">{activeActor.name}</strong> to make a move...
                    </div>
                  ) : actionPanel === 'RESPOND' && pendingAsk ? (
                    <div className="space-y-4">
                      <div className="flex items-center justify-between">
                        <div>
                          <span className="text-xs uppercase tracking-wider font-bold text-amber-400">
                            Incoming Request
                          </span>
                          <h3 className="text-lg font-bold text-white">
                            {gameState.players[pendingAsk.asker].name} asks{' '}
                            <span className="text-indigo-300">
                              {gameState.players[pendingAsk.target].name}
                            </span>{' '}
                            for{' '}
                            <span className="text-amber-300">
                              {pendingAsk.suitEmoji} {pendingAsk.suitName}
                            </span>
                          </h3>
                        </div>
                      </div>
                      <p className="text-xs text-slate-400">
                        {gameState.players[pendingAsk.target].name}, do you have at least one card of{' '}
                        {pendingAsk.suitEmoji} {pendingAsk.suitName}? (Answering impossibly causes a Paradox loss!)
                      </p>
                      <div className="grid grid-cols-2 gap-3">
                        <button
                          type="button"
                          onClick={() => executeResponse(true)}
                          className="py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-white shadow-lg transition"
                        >
                          ✅ YES (Give 1 Card)
                        </button>
                        <button
                          type="button"
                          onClick={() => executeResponse(false)}
                          className="py-3 rounded-xl bg-rose-600 hover:bg-rose-500 font-bold text-white shadow-lg transition"
                        >
                          ❌ NO (Go Fish)
                        </button>
                      </div>
                    </div>
                  ) : actionPanel === 'MAIN' ? (
                    <div className="space-y-3">
                      <div className="flex items-center justify-between">
                        <h3 className="text-base font-bold text-white">
                          {activeActor.name}'s Turn — Choose an Action
                        </h3>
                        <span className="text-xs text-slate-400">
                          Hand: {currentPlayerCards.length} cards
                        </span>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <button
                          type="button"
                          disabled={mustGuessOnly}
                          onClick={() => {
                            setSelectedTarget(null);
                            setSelectedSuitOption(
                              gameState.suits.length > 0 ? gameState.suits[0].id : 'NEW'
                            );
                            setNewSuitName('');
                            setNewSuitEmoji(availableQuickEmojis[0] || '🌟');
                            setActionPanel('ASK');
                          }}
                          className="p-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-35 disabled:cursor-not-allowed text-left transition shadow-lg shadow-indigo-600/20"
                        >
                          <div className="text-xl mb-1">🎣</div>
                          <div className="font-bold text-sm text-white">Go Fish</div>
                          <div className="text-xs text-indigo-200 mt-0.5">
                            Ask a player for a suit
                          </div>
                        </button>

                        <button
                          type="button"
                          disabled={!canClaimVictory}
                          onClick={() => {
                            setClaimSuitId(gameState.suits[0]?.id ?? null);
                            setActionPanel('CLAIM');
                          }}
                          className="p-4 rounded-xl bg-amber-600 hover:bg-amber-500 disabled:opacity-35 disabled:cursor-not-allowed text-left transition shadow-lg shadow-amber-600/20"
                        >
                          <div className="text-xl mb-1">👑</div>
                          <div className="font-bold text-sm text-white">Claim Victory</div>
                          <div className="text-xs text-amber-100 mt-0.5">
                            {currentPlayerCards.length < 4
                              ? 'Requires at least 4 cards'
                              : gameState.suits.length === 0
                              ? 'No suits named yet'
                              : 'Prove you hold all 4 of a suit'}
                          </div>
                        </button>

                        <button
                          type="button"
                          onClick={() => {
                            const initialGuess = {};
                            gameState.cards.forEach((c) => {
                              initialGuess[c.id] = 0;
                            });
                            setGuessMap(initialGuess);
                            setActionPanel('GUESS');
                          }}
                          className="p-4 rounded-xl bg-purple-600 hover:bg-purple-500 text-left transition shadow-lg shadow-purple-600/20"
                        >
                          <div className="text-xl mb-1">🧠</div>
                          <div className="font-bold text-sm text-white">Guess Everything</div>
                          <div className="text-xs text-purple-200 mt-0.5">
                            Assign every card on the table
                          </div>
                        </button>
                      </div>
                    </div>
                  ) : actionPanel === 'ASK' ? (
                    <div className="space-y-4">
                      <div className="flex items-center justify-between">
                        <h3 className="text-base font-bold text-white">🎣 Go Fish — Ask a Player</h3>
                        <button
                          type="button"
                          onClick={() => setActionPanel('MAIN')}
                          className="text-xs text-slate-400 hover:text-white"
                        >
                          ← Back
                        </button>
                      </div>

                      {/* Target Opponent */}
                      <div>
                        <label className="text-xs font-semibold uppercase text-slate-400 block mb-1.5">
                          1. Select Player to Ask
                        </label>
                        <div className="flex flex-wrap gap-2">
                          {gameState.players
                            .filter((p) => p.id !== gameState.currentTurn)
                            .map((p) => {
                              const count = gameState.cards.filter((c) => c.owner === p.id).length;
                              return (
                                <button
                                  key={p.id}
                                  type="button"
                                  disabled={count === 0}
                                  onClick={() => setSelectedTarget(p.id)}
                                  className={`px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                                    selectedTarget === p.id
                                      ? 'bg-indigo-600 border-indigo-400 text-white'
                                      : 'bg-slate-950 border-slate-800 text-slate-300 disabled:opacity-35'
                                  }`}
                                >
                                  {p.name} ({count} cards)
                                </button>
                              );
                            })}
                        </div>
                      </div>

                      {/* Suit Selection or Create New Suit */}
                      <div>
                        <label className="text-xs font-semibold uppercase text-slate-400 block mb-1.5">
                          2. Select Suit
                        </label>
                        <div className="flex flex-wrap gap-2">
                          {gameState.suits.map((s) => (
                            <button
                              key={s.id}
                              type="button"
                              onClick={() => setSelectedSuitOption(s.id)}
                              className={`px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                                selectedSuitOption === s.id
                                  ? 'bg-purple-600 border-purple-400 text-white'
                                  : 'bg-slate-950 border-slate-800 text-slate-300'
                              }`}
                            >
                              {s.emoji} {s.name}
                            </button>
                          ))}

                          {gameState.suits.length < gameState.numPlayers && (
                            <button
                              type="button"
                              onClick={() => setSelectedSuitOption('NEW')}
                              className={`px-3.5 py-2 rounded-xl text-xs font-bold border border-dashed transition ${
                                selectedSuitOption === 'NEW'
                                  ? 'bg-pink-600/30 border-pink-400 text-pink-200'
                                  : 'bg-slate-950 border-slate-700 text-slate-400'
                              }`}
                            >
                              + Create New Suit ({gameState.numPlayers - gameState.suits.length} left)
                            </button>
                          )}
                        </div>
                      </div>

                      {/* New Suit Creator (Allows ANY Emoji via keyboard/picker + quick picks) */}
                      {selectedSuitOption === 'NEW' && (
                        <div className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-3">
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <div className="sm:col-span-2">
                              <label className="text-xs text-slate-400 block mb-1">
                                New Suit Name
                              </label>
                              <input
                                type="text"
                                value={newSuitName}
                                onChange={(e) => setNewSuitName(e.target.value)}
                                placeholder="Type any suit name (e.g. Dragons, Pizza, Lasers)..."
                                className="w-full bg-slate-900 border border-slate-800 focus:border-indigo-500 rounded-lg px-3 py-2 text-sm text-white outline-none"
                              />
                            </div>
                            <div>
                              <label className="text-xs text-slate-400 block mb-1">
                                Any Emoji (Type or Pick)
                              </label>
                              <div className="flex items-center gap-2">
                                <input
                                  type="text"
                                  value={newSuitEmoji}
                                  onChange={(e) => {
                                    const g = extractFirstGrapheme(e.target.value);
                                    setNewSuitEmoji(g || e.target.value);
                                  }}
                                  placeholder="Type any emoji..."
                                  className="w-full bg-slate-900 border border-slate-800 focus:border-indigo-500 rounded-lg px-3 py-2 text-center text-lg text-white outline-none"
                                />
                              </div>
                            </div>
                          </div>

                          {!isEmojiUnique && parsedCustomEmoji && (
                            <p className="text-xs text-rose-400">
                              That emoji ({parsedCustomEmoji}) is already used by another suit—pick or type a different one.
                            </p>
                          )}

                          <div>
                            <label className="text-xs text-slate-400 block mb-1">
                              Quick Picks (Or use your device emoji keyboard above!)
                            </label>
                            <div className="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto p-1">
                              {availableQuickEmojis.map((em) => (
                                <button
                                  key={em}
                                  type="button"
                                  onClick={() => setNewSuitEmoji(em)}
                                  className={`w-8 h-8 rounded-lg flex items-center justify-center text-base border ${
                                    parsedCustomEmoji === em
                                      ? 'bg-indigo-600 border-white scale-110'
                                      : 'bg-slate-900 border-slate-800 hover:border-slate-600'
                                  }`}
                                >
                                  {em}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>
                      )}

                      <button
                        type="button"
                        disabled={
                          selectedTarget === null ||
                          (selectedSuitOption === 'NEW' &&
                            (!newSuitName.trim() ||
                              !isEmojiUnique ||
                              gameState.suits.some(
                                (s) => s.name.toLowerCase() === newSuitName.trim().toLowerCase()
                              )))
                        }
                        onClick={() =>
                          executeAsk(selectedTarget, selectedSuitOption, newSuitName, parsedCustomEmoji)
                        }
                        className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 font-bold text-sm text-white transition"
                      >
                        Ask Question
                      </button>
                    </div>
                  ) : actionPanel === 'CLAIM' ? (
                    <div className="space-y-4">
                      <div className="flex items-center justify-between">
                        <h3 className="text-base font-bold text-white">
                          👑 Claim Victory — Select Your Complete Suit
                        </h3>
                        <button
                          type="button"
                          onClick={() => setActionPanel('MAIN')}
                          className="text-xs text-slate-400 hover:text-white"
                        >
                          ← Back
                        </button>
                      </div>
                      <p className="text-xs text-slate-400">
                        Select a suit. The quantum solver will attempt to construct a valid reality where you do{' '}
                        <strong>not</strong> hold all 4 cards of that suit. If any counter-example exists, your turn ends!
                      </p>
                      <div className="flex flex-wrap gap-2">
                        {gameState.suits.map((s) => (
                          <button
                            key={s.id}
                            type="button"
                            onClick={() => setClaimSuitId(s.id)}
                            className={`px-4 py-2.5 rounded-xl text-sm font-bold border transition ${
                              claimSuitId === s.id
                                ? 'bg-amber-600 border-amber-300 text-white'
                                : 'bg-slate-950 border-slate-800 text-slate-300'
                            }`}
                          >
                            {s.emoji} {s.name}
                          </button>
                        ))}
                      </div>
                      <button
                        type="button"
                        disabled={claimSuitId === null}
                        onClick={() => executeClaimVictory(claimSuitId)}
                        className="w-full py-3 rounded-xl bg-amber-600 hover:bg-amber-500 disabled:opacity-40 font-bold text-sm text-white transition"
                      >
                        Prove I Hold All 4 Cards
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <div className="flex items-center justify-between">
                        <h3 className="text-base font-bold text-white">
                          🧠 Guess Everything — Collapse the Entire Table
                        </h3>
                        <button
                          type="button"
                          onClick={() => setActionPanel('MAIN')}
                          className="text-xs text-slate-400 hover:text-white"
                        >
                          ← Back
                        </button>
                      </div>
                      <p className="text-xs text-slate-400">
                        Assign the suits in each player's hand (card order within a hand does not matter). You win <strong>only</strong> if no alternate distribution is possible; otherwise your turn ends!
                      </p>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-64 overflow-y-auto pr-1">
                        {gameState.players.map((p) => {
                          const pCards = gameState.cards.filter((c) => c.owner === p.id);
                          return (
                            <div
                              key={p.id}
                              className="p-3 rounded-xl bg-slate-950 border border-slate-800 space-y-2"
                            >
                              <div className="font-bold text-xs text-indigo-300">{p.name}</div>
                              {pCards.length === 0 ? (
                                <div className="text-xs text-slate-500 italic">0 cards</div>
                              ) : (
                                pCards.map((c, idx) => (
                                  <div key={c.id} className="flex items-center justify-between gap-2">
                                    <span className="text-xs font-mono text-slate-300">
                                      Slot {idx + 1} (#{c.id + 1})
                                    </span>
                                    <select
                                      value={guessMap[c.id] ?? 0}
                                      onChange={(e) =>
                                        setGuessMap((prev) => ({
                                          ...prev,
                                          [c.id]: Number(e.target.value)
                                        }))
                                      }
                                      className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white outline-none"
                                    >
                                      {Array.from({ length: gameState.numPlayers }, (_, sIdx) => (
                                        <option key={sIdx} value={sIdx}>
                                          {getSuitDisplay(sIdx)}
                                        </option>
                                      ))}
                                    </select>
                                  </div>
                                ))
                              )}
                            </div>
                          );
                        })}
                      </div>

                      <button
                        type="button"
                        onClick={executeGuessEverything}
                        className="w-full py-3 rounded-xl bg-purple-600 hover:bg-purple-500 font-bold text-sm text-white transition"
                      >
                        Submit Final Wavefunction Collapse
                      </button>
                    </div>
                  )}
                </div>
              )}
            </main>
          )}

          {/* PARADOX WARNING MODAL */}
          {paradoxWarning && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="max-w-md w-full bg-slate-900 border-2 border-amber-500 rounded-2xl p-6 shadow-2xl space-y-4">
                <div className="flex items-center gap-3 text-amber-400">
                  <span className="text-2xl">⚠️</span>
                  <h3 className="text-lg font-extrabold">{paradoxWarning.title}</h3>
                </div>
                <p className="text-sm text-slate-200 leading-relaxed">{paradoxWarning.message}</p>
                <div className="grid grid-cols-2 gap-3 pt-2">
                  <button
                    type="button"
                    onClick={() => setParadoxWarning(null)}
                    className="py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 font-bold text-xs text-white transition"
                  >
                    Cancel & Reconsider
                  </button>
                  <button
                    type="button"
                    onClick={paradoxWarning.onProceed}
                    className="py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 font-bold text-xs text-white transition"
                  >
                    Do It Anyway (Lose)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SECRET INSPECTOR MODAL */}
          {inspectorOpen && analysis && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="max-w-4xl w-full bg-slate-900 border border-indigo-500 rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto space-y-4">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div>
                    <span className="text-[10px] uppercase tracking-widest font-bold text-indigo-400">
                      Quantum Omniscience Matrix
                    </span>
                    <h3 className="text-lg font-extrabold text-white">
                      Known Cards, Eliminated Suits & Game Log
                    </h3>
                  </div>
                  <button
                    type="button"
                    onClick={() => setInspectorOpen(false)}
                    className="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-white"
                  >
                    Close
                  </button>
                </div>

                {/* Live Suit Deduction Summary */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-950/90 border border-slate-800 rounded-xl p-3">
                  {analysis.suitSummaries.map((ss) => (
                    <div key={ss.suitId} className="text-xs flex items-center justify-between px-2 py-1 rounded bg-slate-900">
                      <span className="font-semibold text-slate-200">{ss.label}</span>
                      <span className="font-mono text-[11px] text-indigo-300">
                        Known: {ss.knownCards.length} • Candidates: {ss.candidateCards.length}
                      </span>
                    </div>
                  ))}
                </div>

                {/* Per-Player Known & Eliminated Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  {gameState.players.map((p) => {
                    const pCards = gameState.cards.filter((c) => c.owner === p.id);
                    return (
                      <div
                        key={p.id}
                        className="p-3.5 rounded-xl bg-slate-950 border border-slate-800 space-y-2"
                      >
                        <div className="font-bold text-sm text-indigo-300 flex justify-between">
                          <span>{p.name}</span>
                          <span className="text-xs text-slate-500">{pCards.length} cards</span>
                        </div>
                        {pCards.length === 0 ? (
                          <div className="text-xs text-slate-500 italic">No cards</div>
                        ) : (
                          pCards.map((c) => {
                            const known = analysis.knownSuit[c.id];
                            const impossible = analysis.impossibleNamedSuits[c.id];
                            const unnamedOut = analysis.unnamedEliminated[c.id];
                            const eliminatedLabels = [
                              ...impossible.map((sId) => `${gameState.suits[sId].emoji} ${gameState.suits[sId].name}`),
                              ...(unnamedOut
                                ? [analysis.unnamedCount === 1 ? '❔ Final Unnamed Suit' : `❔ All ${analysis.unnamedCount} Unnamed Suits`]
                                : [])
                            ];
                            return (
                              <div
                                key={c.id}
                                className="p-2 rounded-lg bg-slate-900 border border-slate-800/80 text-xs space-y-1"
                              >
                                <div className="flex items-center justify-between">
                                  <span className="font-mono font-bold text-slate-300">
                                    Card #{c.id + 1}
                                  </span>
                                  {known !== null ? (
                                    <span className="px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-bold">
                                      KNOWN: {getSuitDisplay(known)}
                                    </span>
                                  ) : (
                                    <span className="px-2 py-0.5 rounded bg-indigo-500/20 text-indigo-300">
                                      Unknown ({analysis.cardPossibilities[c.id].size} possible)
                                    </span>
                                  )}
                                </div>
                                {known === null && (
                                  <div className="text-[11px] text-rose-300/90">
                                    Cannot be:{' '}
                                    {eliminatedLabels.length === 0
                                      ? 'None eliminated yet'
                                      : eliminatedLabels.join(', ')}
                                  </div>
                                )}
                              </div>
                            );
                          })
                        )}
                      </div>
                    );
                  })}
                </div>

                {/* Enlarged Quantum Event Log */}
                <div className="bg-slate-950 border border-slate-800 rounded-xl p-4">
                  <div className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                    Quantum Event Log ({gameState.log.length} entries)
                  </div>
                  <div className="space-y-1.5 max-h-96 overflow-y-auto text-xs sm:text-sm text-slate-200 font-mono pr-1">
                    {gameState.log.map((entry, idx) => (
                      <div key={idx} className="py-1 border-b border-slate-800/60 last:border-0 leading-relaxed">
                        {entry}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
