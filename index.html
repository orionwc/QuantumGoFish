<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Go Fish</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>

      0%, 100% { transform: translateY(0px); }

    }
    @keyframes bannerSlideIn {
      0% { opacity: 0; transform: translate(-50%, -24px) scale(0.96); }

    }
    .card-float { animation: float 3s ease-in-out infinite; }
    .banner-pop { animation: bannerSlideIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .perspective-1000 { perspective: 1000px; }

  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const SPECIAL_NAMES = new Set(['orion', 'magicaldroid', '😎', 'admin', 'dev', 'luca']);
    const isSpecialName = (name) => SPECIAL_NAMES.has((name || '').trim().toLowerCase());

    const QUICK_EMOJIS = [
      '🔥', '🌊', '⚡', '🍀', '🌙', '☀️', '❄️', '💎',
      '👑', '🐉', '🦊', '🦉', '🐙', '🦄', '🍄', '🌸',
      '🚀', '🪐', '🔮', '🎲', '🎭', '⚔️', '🛡️', '🧭',
      '🍎', '🍋', '🍇', '🍉', '🍕', '🍩', '☕', '🌵'
    ];

    const KONAMI_SEQUENCE = [
      'ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown',
      'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight',
      'b', 'a'
    ];

    // Extract first grapheme / emoji cluster cleanly so any emoji (including ZWJ / skin tones / flags) works
    function extractFirstGrapheme(str) {
      const trimmed = (str || '').trim();
      if (!trimmed) return '';
      if (typeof Intl !== 'undefined' && Intl.Segmenter) {
        const segmenter = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
        const first = segmenter.segment(trimmed)[Symbol.iterator]().next().value;
        return first ? first.segment : '';
      }
      return Array.from(trimmed)[0] || '';
    }

    // =========================================================================
    // QUANTUM CONSTRAINT SOLVER ENGINE
    // =========================================================================
    function createInitialState(playerNames, mode) {
      const n = playerNames.length;
      const cards = [];
      for (let p = 0; p < n; p++) {
        for (let c = 0; c < 4; c++) {
          cards.push({
            id: p * 4 + c,
            owner: p,
            slotIndex: c
          });
        }
      }
      return {
        numPlayers: n,
        players: playerNames.map((name, idx) => ({ id: idx, name: name.trim() })),
        mode, // 'sitaround' | 'passplay' | 'online'
        cards,
        suits: [], // { id: 0..n-1, name, emoji }
        constraints: [], // { type: 'NOT_SUIT' | 'IS_SUIT', cardId, suitId } | { type: 'ONE_OF_IN_SET', cardIds: number[], suitId }
        currentTurn: 0,
        turnCount: 1,
        log: ['Game started! All cards are in quantum superposition.'],
        status: 'PLAYING', // 'PLAYING' | 'GAME_OVER'
        result: null, // { won: boolean, title, reason, counterExample?: number[] }
        turnNotice: null, // { title, reason, counterExample?: number[] }
        revealingCards: null // { cardIds: number[], suitEmoji: string, suitName: string }
      };
    }

    // Backtracking SAT solver over card assignments (cardId -> 0..numPlayers-1)
    function findValidAssignment(numPlayers, cards, namedSuitCount, constraints, forcedOverrides = {}) {
      const totalCards = numPlayers * 4;
      const possible = Array.from({ length: totalCards }, () => new Set());
      for (let i = 0; i < totalCards; i++) {
        if (forcedOverrides[i] !== undefined) {
          possible[i].add(forcedOverrides[i]);
        } else {
          for (let s = 0; s < numPlayers; s++) possible[i].add(s);
        }
      }

      const setConstraints = [];
      for (const c of constraints) {
        if (c.type === 'NOT_SUIT') {
          possible[c.cardId].delete(c.suitId);
        } else if (c.type === 'IS_SUIT') {
          for (let s = 0; s < numPlayers; s++) {
            if (s !== c.suitId) possible[c.cardId].delete(s);
          }
        } else if (c.type === 'ONE_OF_IN_SET') {
          setConstraints.push(c);
        }
      }

      for (let i = 0; i < totalCards; i++) {
        if (possible[i].size === 0) return null;
      }

      const assignment = new Array(totalCards).fill(-1);
      const suitCounts = new Array(numPlayers).fill(0);

      const order = Array.from({ length: totalCards }, (_, i) => i)
        .sort((a, b) => possible[a].size - possible[b].size);

      function checkSetConstraintsPartial() {
        for (const sc of setConstraints) {
          let satisfied = false;
          let hasUnassigned = false;
          for (const cid of sc.cardIds) {
            if (assignment[cid] === sc.suitId) {
              satisfied = true;
              break;
            }
            if (assignment[cid] === -1 && possible[cid].has(sc.suitId)) {
              hasUnassigned = true;
            }
          }
          if (!satisfied && !hasUnassigned) return false;
        }
        return true;
      }

      function backtrack(idx, maxUnnamedUsed) {
        if (idx === totalCards) {
          return assignment.slice();
        }
        const cid = order[idx];
        const remainingSlots = totalCards - idx;

        for (let s = 0; s < numPlayers; s++) {
          const needed = 4 - suitCounts[s];
          if (needed < 0 || needed > remainingSlots) return null;
        }

        for (const s of possible[cid]) {
          if (suitCounts[s] >= 4) continue;
          if (s >= namedSuitCount && s > maxUnnamedUsed + 1) continue;

          assignment[cid] = s;
          suitCounts[s]++;

          if (checkSetConstraintsPartial()) {
            const nextMaxUnnamed = s >= namedSuitCount ? Math.max(maxUnnamedUsed, s) : maxUnnamedUsed;
            const res = backtrack(idx + 1, nextMaxUnnamed);
            if (res) return res;
          }

          assignment[cid] = -1;
          suitCounts[s]--;
        }
        return null;
      }

      return backtrack(0, namedSuitCount - 1);
    }

    // Order-independent multiset SAT solver
    function findValidAssignmentWithMultisets(numPlayers, cards, namedSuitCount, constraints, playerMultisets) {
      const totalCards = numPlayers * 4;
      const possible = Array.from({ length: totalCards }, () => new Set());
      for (let i = 0; i < totalCards; i++) {
        const owner = cards[i].owner;
        for (let s = 0; s < numPlayers; s++) {
          if ((playerMultisets[owner]?.[s] || 0) > 0) {
            possible[i].add(s);
          }
        }
      }

      const setConstraints = [];
      for (const c of constraints) {
        if (c.type === 'NOT_SUIT') {
          possible[c.cardId].delete(c.suitId);
        } else if (c.type === 'IS_SUIT') {
          for (let s = 0; s < numPlayers; s++) {
            if (s !== c.suitId) possible[c.cardId].delete(s);
          }
        } else if (c.type === 'ONE_OF_IN_SET') {
          setConstraints.push(c);
        }
      }

      for (let i = 0; i < totalCards; i++) {
        if (possible[i].size === 0) return null;
      }

      const assignment = new Array(totalCards).fill(-1);
      const remainingPlayerSuits = playerMultisets.map((ms) => [...ms]);
      const suitCounts = new Array(numPlayers).fill(0);

      const order = Array.from({ length: totalCards }, (_, i) => i)
        .sort((a, b) => possible[a].size - possible[b].size);

      function checkSetConstraintsPartial() {
        for (const sc of setConstraints) {
          let satisfied = false;
          let hasUnassigned = false;
          for (const cid of sc.cardIds) {
            if (assignment[cid] === sc.suitId) {
              satisfied = true;
              break;
            }
            if (assignment[cid] === -1 && possible[cid].has(sc.suitId)) {
              hasUnassigned = true;
            }
          }
          if (!satisfied && !hasUnassigned) return false;
        }
        return true;
      }

      function backtrack(idx) {
        if (idx === totalCards) {
          return assignment.slice();
        }
        const cid = order[idx];
        const owner = cards[cid].owner;
        const remainingSlots = totalCards - idx;

        for (let s = 0; s < numPlayers; s++) {
          const needed = 4 - suitCounts[s];
          if (needed < 0 || needed > remainingSlots) return null;
        }

        for (const s of possible[cid]) {
          if (suitCounts[s] >= 4) continue;
          if (remainingPlayerSuits[owner][s] <= 0) continue;

          assignment[cid] = s;
          suitCounts[s]++;
          remainingPlayerSuits[owner][s]--;

          if (checkSetConstraintsPartial()) {
            const res = backtrack(idx + 1);
            if (res) return res;
          }

          assignment[cid] = -1;
          suitCounts[s]--;
          remainingPlayerSuits[owner][s]++;
        }
        return null;
      }

      return backtrack(0);
    }

    // Search for any valid assignment with a different per-player suit multiset
    function findDifferentMultisetAssignment(numPlayers, cards, namedSuitCount, constraints, targetMultisets) {
      const totalCards = numPlayers * 4;
      const possible = Array.from({ length: totalCards }, () => new Set());
      for (let i = 0; i < totalCards; i++) {
        for (let s = 0; s < numPlayers; s++) possible[i].add(s);
      }

      const setConstraints = [];
      for (const c of constraints) {
        if (c.type === 'NOT_SUIT') {
          possible[c.cardId].delete(c.suitId);
        } else if (c.type === 'IS_SUIT') {
          for (let s = 0; s < numPlayers; s++) {
            if (s !== c.suitId) possible[c.cardId].delete(s);
          }
        } else if (c.type === 'ONE_OF_IN_SET') {
          setConstraints.push(c);
        }
      }

      for (let i = 0; i < totalCards; i++) {
        if (possible[i].size === 0) return null;
      }

      const assignment = new Array(totalCards).fill(-1);
      const currentPlayerSuits = Array.from({ length: numPlayers }, () => new Array(numPlayers).fill(0));
      const suitCounts = new Array(numPlayers).fill(0);

      const order = Array.from({ length: totalCards }, (_, i) => i)
        .sort((a, b) => possible[a].size - possible[b].size);

      function checkSetConstraintsPartial() {
        for (const sc of setConstraints) {
          let satisfied = false;
          let hasUnassigned = false;
          for (const cid of sc.cardIds) {
            if (assignment[cid] === sc.suitId) {
              satisfied = true;
              break;
            }
            if (assignment[cid] === -1 && possible[cid].has(sc.suitId)) {
              hasUnassigned = true;
            }
          }
          if (!satisfied && !hasUnassigned) return false;
        }
        return true;
      }

      function differsFromTarget() {
        for (let p = 0; p < numPlayers; p++) {
          for (let s = 0; s < numPlayers; s++) {
            if (currentPlayerSuits[p][s] !== targetMultisets[p][s]) return true;
          }
        }
        return false;
      }

      function backtrack(idx, maxUnnamedUsed) {
        if (idx === totalCards) {
          return differsFromTarget() ? assignment.slice() : null;
        }
        const cid = order[idx];
        const owner = cards[cid].owner;
        const remainingSlots = totalCards - idx;

        for (let s = 0; s < numPlayers; s++) {
          const needed = 4 - suitCounts[s];
          if (needed < 0 || needed > remainingSlots) return null;
        }

        for (const s of possible[cid]) {
          if (suitCounts[s] >= 4) continue;
          if (s >= namedSuitCount && s > maxUnnamedUsed + 1) continue;

          assignment[cid] = s;
          suitCounts[s]++;
          currentPlayerSuits[owner][s]++;

          if (checkSetConstraintsPartial()) {
            const nextMaxUnnamed = s >= namedSuitCount ? Math.max(maxUnnamedUsed, s) : maxUnnamedUsed;
            const res = backtrack(idx + 1, nextMaxUnnamed);
            if (res) return res;
          }

          assignment[cid] = -1;
          suitCounts[s]--;
          currentPlayerSuits[owner][s]--;
        }
        return null;
      }

      return backtrack(0, namedSuitCount - 1);
    }

    function analyzeQuantumState(state) {
      const { numPlayers, cards, suits, constraints } = state;
      const totalCards = numPlayers * 4;
      const namedCount = suits.length;
      const unnamedCount = numPlayers - namedCount;

      const cardPossibilities = Array.from({ length: totalCards }, () => new Set());
      const canBeUnnamed = new Array(totalCards).fill(false);
      let sampleWorld = null;

      for (let cid = 0; cid < totalCards; cid++) {
        for (let s = 0; s < namedCount; s++) {
          const world = findValidAssignment(numPlayers, cards, namedCount, constraints, { [cid]: s });
          if (world) {
            cardPossibilities[cid].add(s);
            if (!sampleWorld) sampleWorld = world;
          }
        }
        if (unnamedCount > 0) {
          const world = findValidAssignment(numPlayers, cards, namedCount, constraints, { [cid]: namedCount });
          if (world) {
            canBeUnnamed[cid] = true;
            for (let s = namedCount; s < numPlayers; s++) {
              cardPossibilities[cid].add(s);
            }
            if (!sampleWorld) sampleWorld = world;
          }
        }
      }

      const knownSuit = new Array(totalCards).fill(null);
      const impossibleNamedSuits = Array.from({ length: totalCards }, () => []);
      const unnamedEliminated = new Array(totalCards).fill(false);

      for (let cid = 0; cid < totalCards; cid++) {
        if (cardPossibilities[cid].size === 1) {
          knownSuit[cid] = [...cardPossibilities[cid]][0];
        }
        for (let s = 0; s < namedCount; s++) {
          if (!cardPossibilities[cid].has(s)) {
            impossibleNamedSuits[cid].push(s);
          }
        }
        if (unnamedCount > 0 && !canBeUnnamed[cid]) {
          unnamedEliminated[cid] = true;
        }
      }

      const suitSummaries = [];
      for (let s = 0; s < namedCount; s++) {
        const knownCards = [];
        const candidateCards = [];
        for (let cid = 0; cid < totalCards; cid++) {
          if (knownSuit[cid] === s) knownCards.push(cid);
          if (cardPossibilities[cid].has(s)) candidateCards.push(cid);
        }
        suitSummaries.push({
          suitId: s,
          label: `${suits[s].emoji} ${suits[s].name}`,
          knownCards,
          candidateCards
        });
      }
      if (unnamedCount > 0) {
        const knownCards = [];
        const candidateCards = [];
        for (let cid = 0; cid < totalCards; cid++) {
          if (knownSuit[cid] !== null && knownSuit[cid] >= namedCount) knownCards.push(cid);
          if (canBeUnnamed[cid]) candidateCards.push(cid);
        }
        suitSummaries.push({
          suitId: namedCount,
          label: unnamedCount === 1 ? '❔ Final Unnamed Suit' : `❔ ${unnamedCount} Unnamed Suits (${unnamedCount * 4} cards)`,
          knownCards,
          candidateCards
        });
      }

      return {
        isConsistent: sampleWorld !== null,
        sampleWorld,
        cardPossibilities,
        knownSuit,
        impossibleNamedSuits,
        unnamedEliminated,
        unnamedCount,
        suitSummaries
      };
    }

    // =========================================================================
    // MAIN APPLICATION COMPONENT
    // =========================================================================
    function App() {
      // Setup & Navigation State
      const [screen, setScreen] = useState('LOBBY'); // 'LOBBY' | 'GAME'
      const [mode, setMode] = useState('sitaround'); // 'sitaround' | 'passplay' | 'online'
      const [playerCount, setPlayerCount] = useState(4);
      const [playerNames, setPlayerNames] = useState(['', '', '', '']);
      const [passPrivacyScreen, setPassPrivacyScreen] = useState(false);

      // Online PeerJS + BroadcastChannel State
      const [onlineRole, setOnlineRole] = useState('HOST'); // 'HOST' | 'GUEST'
      const [roomCode, setRoomCode] = useState('');
      const [joinCodeInput, setJoinCodeInput] = useState('');
      const [myOnlineName, setMyOnlineName] = useState('');
      const [mySeatIndex, setMySeatIndex] = useState(0);
      const [connectedPeers, setConnectedPeers] = useState([]); // [{ clientId, name, seat }]
      const [onlineStatus, setOnlineStatus] = useState('');
      const [joinState, setJoinState] = useState('IDLE'); // 'IDLE' | 'CONNECTING' | 'JOINED'
      const peerRef = useRef(null);
      const connsRef = useRef([]);
      const bcRef = useRef(null);
      const myClientIdRef = useRef(null);
      const joinRetryIntervalRef = useRef(null);
      const connectedPeersRef = useRef([]);
      const playerCountRef = useRef(playerCount);

      useEffect(() => {
        connectedPeersRef.current = connectedPeers;
      }, [connectedPeers]);

      useEffect(() => {
        playerCountRef.current = playerCount;
      }, [playerCount]);

      // Core Game State
      const [gameState, setGameState] = useState(null);

      // Temporary Move Toast Banner (Exact Log Text)
      const [moveBanner, setMoveBanner] = useState(null); // { id: number, text: string }
      const lastBannerLogRef = useRef(null);

      // Turn Action UI State
      const [actionPanel, setActionPanel] = useState('MAIN'); // 'MAIN' | 'ASK' | 'RESPOND' | 'CLAIM' | 'GUESS'
      const [pendingAsk, setPendingAsk] = useState(null); // { asker, target, suitId, suitName, suitEmoji, askerCardId }
      const [selectedTarget, setSelectedTarget] = useState(null);
      const [selectedSuitOption, setSelectedSuitOption] = useState('NEW'); // number | 'NEW'
      const [newSuitName, setNewSuitName] = useState('');
      const [newSuitEmoji, setNewSuitEmoji] = useState(QUICK_EMOJIS[0]);
      const [claimSuitId, setClaimSuitId] = useState(null);
      const [guessMap, setGuessMap] = useState({}); // { [cardId]: suitId }

      // Paradox Warning Modal for Special Names
      const [paradoxWarning, setParadoxWarning] = useState(null); // { title, message, onProceed }

      // Secret Inspector (Orion / Luca / Konami)
      const [konamiUnlocked, setKonamiUnlocked] = useState(false);
      const [inspectorOpen, setInspectorOpen] = useState(false);
      const konamiBufferRef = useRef([]);

      // Clean up online connections on unmount or mode change
      const cleanupOnlineConnections = () => {
        if (joinRetryIntervalRef.current) {
          clearInterval(joinRetryIntervalRef.current);
          joinRetryIntervalRef.current = null;
        }
        if (bcRef.current) {
          bcRef.current.close();
          bcRef.current = null;
        }
        if (peerRef.current) {
          peerRef.current.destroy();
          peerRef.current = null;
        }
        connsRef.current = [];
        setJoinState('IDLE');
        setConnectedPeers([]);
        setRoomCode('');
        setOnlineStatus('');
      };

      // Update playerNames array length when playerCount changes
      useEffect(() => {
        setPlayerNames((prev) => {
          const next = [];
          for (let i = 0; i < playerCount; i++) {
            next.push(prev[i] !== undefined ? prev[i] : '');
          }
          return next;
        });
      }, [playerCount]);

      // Trigger temporary screen banner whenever the latest log entry changes
      useEffect(() => {
        if (!gameState || !gameState.log || gameState.log.length === 0) {
          lastBannerLogRef.current = null;
          setMoveBanner(null);
          return;
        }
        const latestLog = gameState.log[0];
        if (latestLog !== lastBannerLogRef.current) {
          lastBannerLogRef.current = latestLog;
          const bannerId = Date.now() + Math.random();
          setMoveBanner({ id: bannerId, text: latestLog });
          const timer = setTimeout(() => {
            setMoveBanner((curr) => (curr && curr.id === bannerId ? null : curr));
          }, 4200);
          return () => clearTimeout(timer);
        }
      }, [gameState?.log?.[0]]);

      // Konami Code Listener
      useEffect(() => {
        const handleKeyDown = (e) => {
          const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
          konamiBufferRef.current.push(key);
          if (konamiBufferRef.current.length > KONAMI_SEQUENCE.length) {
            konamiBufferRef.current.shift();
          }
          if (
            konamiBufferRef.current.length === KONAMI_SEQUENCE.length &&
            konamiBufferRef.current.every((k, idx) => k === KONAMI_SEQUENCE[idx])
          ) {
            setKonamiUnlocked(true);
            setInspectorOpen((prev) => !prev);
            konamiBufferRef.current = [];
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Quantum Solver Memoized Analysis
      const analysis = useMemo(() => {
        if (!gameState) return null;
        return analyzeQuantumState(gameState);
      }, [gameState]);

      // Check if current viewer can use the hidden logo trigger
      const canUseSecretTrigger = useMemo(() => {
        if (konamiUnlocked) return true;
        if (!gameState) {
          if (mode === 'online') return isSpecialName(myOnlineName);
          return playerNames.some((n) => isSpecialName(n));
        }
        if (gameState.mode === 'online') {
          const me = gameState.players[mySeatIndex];
          return me && isSpecialName(me.name);
        }
        if (gameState.mode === 'passplay') {
          const activeIdx = pendingAsk ? pendingAsk.target : gameState.currentTurn;
          const activeP = gameState.players[activeIdx];
          return activeP && isSpecialName(activeP.name);
        }
        return gameState.players.some((p) => isSpecialName(p.name));
      }, [konamiUnlocked, gameState, mode, myOnlineName, playerNames, mySeatIndex, pendingAsk]);

      const handleLogoClick = () => {
        if (canUseSecretTrigger) {
          setInspectorOpen((prev) => !prev);
        }
      };

      // =========================================================================
      // ONLINE MULTIPLAYER SYNC (PeerJS + Cross-Tab BroadcastChannel)
      // =========================================================================
      const broadcastNetworkState = (nextGameState, nextPendingAsk, nextActionPanel) => {
        const payload = {
          type: 'SYNC_STATE',
          gameState: nextGameState,
          pendingAsk: nextPendingAsk,
          actionPanel: nextActionPanel
        };
        if (bcRef.current) {
          bcRef.current.postMessage(payload);
        }
        connsRef.current.forEach((conn) => {
          if (conn && conn.open) {
            conn.send(payload);
          }
        });
      };

      const applySyncedState = (nextGameState, nextPendingAsk = null, nextActionPanel = 'MAIN') => {
        setGameState(nextGameState);
        setPendingAsk(nextPendingAsk);
        setActionPanel(nextActionPanel);
        if (nextGameState && screen !== 'GAME') {
          setScreen('GAME');
        }
        if (mode === 'online' || (nextGameState && nextGameState.mode === 'online')) {
          broadcastNetworkState(nextGameState, nextPendingAsk, nextActionPanel);
        }
      };

      const setupOnlineHost = () => {
        if (!myOnlineName.trim()) return;
        cleanupOnlineConnections();

        const code = Math.random().toString(36).substring(2, 6).toUpperCase();
        const hostId = 'host-' + Math.random().toString(36).substring(2, 9);
        myClientIdRef.current = hostId;
        setRoomCode(code);
        setMySeatIndex(0);

        const initialRoster = [{ clientId: hostId, name: myOnlineName.trim(), seat: 0 }];
        connectedPeersRef.current = initialRoster;
        setConnectedPeers(initialRoster);
        setOnlineStatus('Creating room ' + code + '...');

        const broadcastRoster = (roster) => {
          const msg = { type: 'ROSTER_UPDATE', roster, playerCount: playerCountRef.current };
          if (bcRef.current) bcRef.current.postMessage(msg);
          connsRef.current.forEach((c) => {
            if (c && c.open) c.send(msg);
          });
        };

        const registerJoiner = (clientId, rawName) => {
          const cleanName = (rawName || '').trim();
          if (!clientId || !cleanName) return;

          const current = connectedPeersRef.current;
          // Deduplicate by clientId or case-insensitive name so local/tab sync never joins twice
          const existing = current.find(
            (p) => p.clientId === clientId || p.name.toLowerCase() === cleanName.toLowerCase()
          );
          if (existing) {
            broadcastRoster(current);
            return;
          }
          if (current.length >= playerCountRef.current) {
            return;
          }
          const updated = [...current, { clientId, name: cleanName, seat: current.length }];
          connectedPeersRef.current = updated;
          setConnectedPeers(updated);
          broadcastRoster(updated);
        };

        const bc = new BroadcastChannel('qgf_room_' + code);
        bcRef.current = bc;
        bc.onmessage = (ev) => {
          const msg = ev.data;
          if (!msg) return;
          if (msg.type === 'JOIN_REQUEST') {
            registerJoiner(msg.clientId, msg.name);
          } else if (msg.type === 'SYNC_STATE') {
            setGameState(msg.gameState);
            setPendingAsk(msg.pendingAsk);
            setActionPanel(msg.actionPanel);
            if (msg.gameState) setScreen('GAME');
          }
        };

        if (window.Peer) {
          const peer = new window.Peer('qgf-room-' + code, {
            debug: 0,
            config: {
              iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
              ]
            }
          });
          peerRef.current = peer;

          peer.on('open', () => {
            setOnlineStatus('Room ' + code + ' is live! Share this code with friends on any device.');
          });

          peer.on('connection', (conn) => {
            connsRef.current.push(conn);
            conn.on('open', () => {
              conn.send({
                type: 'ROSTER_UPDATE',
                roster: connectedPeersRef.current,
                playerCount: playerCountRef.current
              });
            });
            conn.on('data', (msg) => {
              if (!msg) return;
              if (msg.type === 'JOIN_REQUEST') {
                registerJoiner(msg.clientId || conn.peer, msg.name);
              } else if (msg.type === 'SYNC_STATE') {
                setGameState(msg.gameState);
                setPendingAsk(msg.pendingAsk);
                setActionPanel(msg.actionPanel);
                if (msg.gameState) setScreen('GAME');
                // Relay to all other connected devices and local tabs
                if (bcRef.current) bcRef.current.postMessage(msg);
                connsRef.current.forEach((c) => {
                  if (c !== conn && c.open) c.send(msg);
                });
              }
            });
            conn.on('close', () => {
              connsRef.current = connsRef.current.filter((c) => c !== conn);
            });
          });

          peer.on('error', (err) => {
            setOnlineStatus('Room ' + code + ' ready (Tab Sync active; P2P notice: ' + (err?.type || 'network') + ')');
          });
        } else {
          setOnlineStatus('Room ' + code + ' ready (Same-browser tab sync active).');
        }
      };

      const joinOnlineRoom = () => {
        if (joinState !== 'IDLE') return;
        const code = joinCodeInput.trim().toUpperCase();
        const cleanName = myOnlineName.trim();
        if (code.length < 4 || !cleanName) return;

        if (joinRetryIntervalRef.current) {
          clearInterval(joinRetryIntervalRef.current);
          joinRetryIntervalRef.current = null;
        }
        if (bcRef.current) bcRef.current.close();
        if (peerRef.current) peerRef.current.destroy();

        const clientId = 'guest-' + Math.random().toString(36).substring(2, 9);
        myClientIdRef.current = clientId;
        setRoomCode(code);
        setJoinState('CONNECTING');
        setOnlineStatus('Connecting to room ' + code + '...');

        let acknowledged = false;
        const handleRosterUpdate = (roster, totalCount) => {
          setConnectedPeers(roster);
          setPlayerCount(totalCount);
          const me = roster.find(
            (p) => p.clientId === clientId || p.name.toLowerCase() === cleanName.toLowerCase()
          );
          if (me) {
            acknowledged = true;
            setMySeatIndex(me.seat);
            setJoinState('JOINED');
            setOnlineStatus('Joined room ' + code + ' as ' + me.name + '! Waiting for host to start...');
            if (joinRetryIntervalRef.current) {
              clearInterval(joinRetryIntervalRef.current);
              joinRetryIntervalRef.current = null;
            }
          }
        };

        // 1. Same-browser BroadcastChannel listener
        const bc = new BroadcastChannel('qgf_room_' + code);
        bcRef.current = bc;
        bc.onmessage = (ev) => {
          const msg = ev.data;
          if (!msg) return;
          if (msg.type === 'ROSTER_UPDATE') {
            handleRosterUpdate(msg.roster, msg.playerCount);
          } else if (msg.type === 'SYNC_STATE') {
            setGameState(msg.gameState);
            setPendingAsk(msg.pendingAsk);
            setActionPanel(msg.actionPanel);
            if (msg.gameState) setScreen('GAME');
          }
        };
        bc.postMessage({ type: 'JOIN_REQUEST', clientId, name: cleanName });

        // 2. Cross-device PeerJS connection with automatic retry & timeout handling
        if (window.Peer) {
          const peer = new window.Peer(clientId, {
            debug: 0,
            config: {
              iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
              ]
            }
          });
          peerRef.current = peer;

          let activeConn = null;
          const attemptConnect = () => {
            if (acknowledged || !peer || peer.destroyed) return;
            if (activeConn && activeConn.open) {
              activeConn.send({ type: 'JOIN_REQUEST', clientId, name: cleanName });
              return;
            }
            const conn = peer.connect('qgf-room-' + code, { reliable: true });
            activeConn = conn;
            connsRef.current = [conn];

            conn.on('open', () => {
              conn.send({ type: 'JOIN_REQUEST', clientId, name: cleanName });
            });

            conn.on('data', (msg) => {
              if (!msg) return;
              if (msg.type === 'ROSTER_UPDATE') {
                handleRosterUpdate(msg.roster, msg.playerCount);
              } else if (msg.type === 'SYNC_STATE') {
                setGameState(msg.gameState);
                setPendingAsk(msg.pendingAsk);
                setActionPanel(msg.actionPanel);
                if (msg.gameState) setScreen('GAME');
              }
            });
          };

          peer.on('open', () => {
            attemptConnect();
            let attempts = 0;
            joinRetryIntervalRef.current = setInterval(() => {
              if (acknowledged) {
                clearInterval(joinRetryIntervalRef.current);
                joinRetryIntervalRef.current = null;
                return;
              }
              attempts += 1;
              if (attempts >= 6) {
                clearInterval(joinRetryIntervalRef.current);
                joinRetryIntervalRef.current = null;
                setJoinState('IDLE');
                setOnlineStatus('Could not reach room ' + code + '. Check the code and try again.');
                return;
              }
              attemptConnect();
            }, 2500);
          });

          peer.on('error', (err) => {
            if (err && err.type === 'peer-unavailable') {
              if (joinRetryIntervalRef.current) {
                clearInterval(joinRetryIntervalRef.current);
                joinRetryIntervalRef.current = null;
              }
              setJoinState('IDLE');
              setOnlineStatus('Room ' + code + ' not found. Make sure the host generated the code first.');
            }
          });
        }
      };

      // =========================================================================
      // START GAME
      // =========================================================================
      const handleStartGame = () => {
        let names = [];
        if (mode === 'online') {
          if (connectedPeers.length < playerCount) return;
          names = connectedPeers.slice(0, playerCount).map((p) => p.name);
        } else {
          if (playerNames.some((n) => !n.trim())) return;
          names = playerNames.map((n) => n.trim());
        }
        const initial = createInitialState(names, mode);
        setInspectorOpen(false);
        setPassPrivacyScreen(mode === 'passplay');
        applySyncedState(initial, null, 'MAIN');
      };

      // =========================================================================
      // GAME ACTIONS & PARADOX CHECKING
      // =========================================================================
      const triggerLoss = (baseState, playerIdx, reasonText) => {
        const player = baseState.players[playerIdx];
        const nextState = {
          ...baseState,
          status: 'GAME_OVER',
          turnNotice: null,
          log: [`💥 PARADOX! ${player.name} lost: ${reasonText}`, ...baseState.log],
          result: {
            won: false,
            title: `${player.name} Created a Quantum Paradox & Lost!`,
            reason: reasonText
          }
        };
        applySyncedState(nextState, null, 'MAIN');
      };

      const executeAsk = (targetIdx, suitChoice, customName, customEmoji) => {
        const askerIdx = gameState.currentTurn;
        const asker = gameState.players[askerIdx];
        const target = gameState.players[targetIdx];

        let suitId;
        let updatedSuits = [...gameState.suits];

        if (suitChoice === 'NEW') {
          const cleanEmoji = extractFirstGrapheme(customEmoji);
          if (!cleanEmoji || updatedSuits.some((s) => s.emoji === cleanEmoji)) return;
          suitId = updatedSuits.length;
          updatedSuits.push({
            id: suitId,
            name: customName.trim(),
            emoji: cleanEmoji
          });
        } else {
          suitId = Number(suitChoice);
        }

        const suitObj = updatedSuits[suitId];
        const askerCards = gameState.cards.filter((c) => c.owner === askerIdx);
        const targetCards = gameState.cards.filter((c) => c.owner === targetIdx);

        const validAskerCard =
          targetCards.length > 0
            ? askerCards.find((ac) =>
                findValidAssignment(gameState.numPlayers, gameState.cards, updatedSuits.length, [
                  ...gameState.constraints,
                  { type: 'IS_SUIT', cardId: ac.id, suitId }
                ])
              )
            : null;

        const performAskAction = () => {
          if (!validAskerCard) {
            const stateWithSuit = { ...gameState, suits: updatedSuits };
            triggerLoss(
              stateWithSuit,
              askerIdx,
              `${asker.name} asked ${target.name} for ${suitObj.emoji} ${suitObj.name}, which is impossible given current quantum constraints!`
            );
            return;
          }

          const committedConstraints = [
            ...gameState.constraints,
            { type: 'IS_SUIT', cardId: validAskerCard.id, suitId }
          ];

          const nextState = {
            ...gameState,
            suits: updatedSuits,
            constraints: committedConstraints,
            turnNotice: null,
            revealingCards: {
              cardIds: [validAskerCard.id],
              suitEmoji: suitObj.emoji,
              suitName: suitObj.name
            },
            log: [
              `${asker.name} reveals ${suitObj.emoji} ${suitObj.name} on Card #${validAskerCard.id + 1} and asks ${target.name}: "Do you have any ${suitObj.emoji} ${suitObj.name}?"`,
              ...gameState.log
            ]
          };

          const askPayload = {
            asker: askerIdx,
            target: targetIdx,
            suitId,
            suitName: suitObj.name,
            suitEmoji: suitObj.emoji,
            askerCardId: validAskerCard.id
          };

          if (gameState.mode === 'passplay') {
            setPassPrivacyScreen(true);
          }
          applySyncedState(nextState, askPayload, 'RESPOND');
        };

        if (!validAskerCard && isSpecialName(asker.name)) {
          setParadoxWarning({
            title: 'Paradox Warning!',
            message: `${asker.name}, asking ${target.name} for ${suitObj.emoji} ${suitObj.name} violates your known hand possibilities and will immediately cause a Paradox loss!`,
            onProceed: () => {
              setParadoxWarning(null);
              performAskAction();
            }
          });
          return;
        }

        performAskAction();
      };

      const executeResponse = (answerYes) => {
        if (!pendingAsk) return;
        const { asker, target, suitId, suitName, suitEmoji } = pendingAsk;
        const askerObj = gameState.players[asker];
        const targetObj = gameState.players[target];

        const targetCards = gameState.cards.filter((c) => c.owner === target);

        let proposedConstraints;
        if (answerYes) {
          proposedConstraints = [
            ...gameState.constraints,
            { type: 'ONE_OF_IN_SET', cardIds: targetCards.map((c) => c.id), suitId }
          ];
        } else {
          proposedConstraints = [
            ...gameState.constraints,
            ...targetCards.map((c) => ({ type: 'NOT_SUIT', cardId: c.id, suitId }))
          ];
        }

        const validWorld = findValidAssignment(
          gameState.numPlayers,
          gameState.cards,
          gameState.suits.length,
          proposedConstraints
        );

        const performResponseAction = () => {
          if (!validWorld) {
            triggerLoss(
              { ...gameState, revealingCards: null },
              target,
              `${targetObj.name} answered "${answerYes ? 'YES' : 'NO'}" to ${suitEmoji} ${suitName}, contradicting the quantum state!`
            );
            return;
          }

          const nextTurn = (asker + 1) % gameState.numPlayers;

          if (!answerYes) {
            const nextState = {
              ...gameState,
              constraints: proposedConstraints,
              revealingCards: null,
              turnNotice: null,
              currentTurn: nextTurn,
              turnCount: gameState.turnCount + 1,
              log: [
                `${targetObj.name} says NO ("Go Fish!") — none of their cards can be ${suitEmoji} ${suitName}.`,
                ...gameState.log
              ]
            };
            if (gameState.mode === 'passplay') setPassPrivacyScreen(true);
            applySyncedState(nextState, null, 'MAIN');
            return;
          }

          const validTargetCard =
            targetCards.find((tc) =>
              findValidAssignment(gameState.numPlayers, gameState.cards, gameState.suits.length, [
                ...proposedConstraints,
                { type: 'IS_SUIT', cardId: tc.id, suitId }
              ])
            ) || targetCards[0];

          const finalConstraints = [
            ...proposedConstraints,
            { type: 'IS_SUIT', cardId: validTargetCard.id, suitId }
          ];

          const animState = {
            ...gameState,
            constraints: finalConstraints,
            turnNotice: null,
            revealingCards: {
              cardIds: [pendingAsk.askerCardId, validTargetCard.id],
              suitEmoji,
              suitName
            },
            log: [
              `${targetObj.name} says YES! Flips Card #${validTargetCard.id + 1} (${suitEmoji} ${suitName}) and slides it to ${askerObj.name}.`,
              ...gameState.log
            ]
          };

          applySyncedState(animState, null, 'MAIN');

          setTimeout(() => {
            setGameState((curr) => {
              if (!curr || curr.status !== 'PLAYING') return curr;
              const updatedCards = curr.cards.map((c) =>
                c.id === validTargetCard.id ? { ...c, owner: asker } : c
              );
              const settledState = {
                ...curr,
                cards: updatedCards,
                revealingCards: null,
                currentTurn: nextTurn,
                turnCount: curr.turnCount + 1
              };
              if (curr.mode === 'passplay') setPassPrivacyScreen(true);
              if (curr.mode === 'online') {
                broadcastNetworkState(settledState, null, 'MAIN');
              }
              return settledState;
            });
          }, 1800);
        };

        if (!validWorld && isSpecialName(targetObj.name)) {
          setParadoxWarning({
            title: 'Paradox Warning!',
            message: `${targetObj.name}, answering "${answerYes ? 'YES' : 'NO'}" to ${suitEmoji} ${suitName} is impossible under current constraints and will make you lose!`,
            onProceed: () => {
              setParadoxWarning(null);
              performResponseAction();
            }
          });
          return;
        }

        performResponseAction();
      };

      const executeClaimVictory = (suitId) => {
        const playerIdx = gameState.currentTurn;
        const player = gameState.players[playerIdx];
        const suitObj = gameState.suits[suitId];
        const playerCards = gameState.cards.filter((c) => c.owner === playerIdx);

        if (playerCards.length < 4) return;

        const otherCards = gameState.cards.filter((c) => c.owner !== playerIdx);
        const counterConstraints = [
          ...gameState.constraints,
          { type: 'ONE_OF_IN_SET', cardIds: otherCards.map((c) => c.id), suitId }
        ];

        const counterWorld =
          otherCards.length > 0
            ? findValidAssignment(
                gameState.numPlayers,
                gameState.cards,
                gameState.suits.length,
                counterConstraints
              )
            : null;

        if (!counterWorld) {
          const nextState = {
            ...gameState,
            status: 'GAME_OVER',
            turnNotice: null,
            log: [`🏆 ${player.name} CLAIMED VICTORY with all 4 ${suitObj.emoji} ${suitObj.name}!`, ...gameState.log],
            result: {
              won: true,
              title: `${player.name} Wins!`,
              reason: `Proven beyond quantum doubt: ${player.name} holds all 4 cards of ${suitObj.emoji} ${suitObj.name}!`
            }
          };
          applySyncedState(nextState, null, 'MAIN');
        } else {
          const nextTurn = (playerIdx + 1) % gameState.numPlayers;
          const nextState = {
            ...gameState,
            currentTurn: nextTurn,
            turnCount: gameState.turnCount + 1,
            turnNotice: {
              title: `${player.name}'s Victory Claim Refuted! (Turn Ended)`,
              reason: `Another quantum reality exists where ${player.name} does NOT hold all 4 ${suitObj.emoji} ${suitObj.name}. Play passes to ${gameState.players[nextTurn].name}.`,
              counterExample: counterWorld
            },
            log: [
              `❌ ${player.name}'s Claim Victory on ${suitObj.emoji} ${suitObj.name} was refuted — turn passes to ${gameState.players[nextTurn].name}.`,
              ...gameState.log
            ]
          };
          if (gameState.mode === 'passplay') setPassPrivacyScreen(true);
          applySyncedState(nextState, null, 'MAIN');
        }
      };

      const executeGuessEverything = () => {
        const playerIdx = gameState.currentTurn;
        const player = gameState.players[playerIdx];
        const totalCards = gameState.numPlayers * 4;

        const playerMultisets = Array.from({ length: gameState.numPlayers }, () =>
          new Array(gameState.numPlayers).fill(0)
        );
        for (let cid = 0; cid < totalCards; cid++) {
          if (guessMap[cid] === undefined || guessMap[cid] === null) return;
          const owner = gameState.cards[cid].owner;
          const suitId = Number(guessMap[cid]);
          playerMultisets[owner][suitId]++;
        }

        const matchingWorld = findValidAssignmentWithMultisets(
          gameState.numPlayers,
          gameState.cards,
          gameState.suits.length,
          gameState.constraints,
          playerMultisets
        );

        const nextTurn = (playerIdx + 1) % gameState.numPlayers;

        if (!matchingWorld) {
          const validSample = analysis.sampleWorld;
          const nextState = {
            ...gameState,
            currentTurn: nextTurn,
            turnCount: gameState.turnCount + 1,
            turnNotice: {
              title: `${player.name}'s Final Guess Was Invalid! (Turn Ended)`,
              reason: `No valid quantum reality matches those hand counts. Here is a valid reality instead—play passes to ${gameState.players[nextTurn].name}.`,
              counterExample: validSample
            },
            log: [
              `❌ ${player.name} guessed an impossible hand distribution — turn passes to ${gameState.players[nextTurn].name}.`,
              ...gameState.log
            ]
          };
          if (gameState.mode === 'passplay') setPassPrivacyScreen(true);
          applySyncedState(nextState, null, 'MAIN');
          return;
        }

        const alternateWorld = findDifferentMultisetAssignment(
          gameState.numPlayers,
          gameState.cards,
          gameState.suits.length,
          gameState.constraints,
          playerMultisets
        );

        if (!alternateWorld) {
          const nextState = {
            ...gameState,
            status: 'GAME_OVER',
            turnNotice: null,
            log: [`🏆 ${player.name} COLLAPSED THE WAVEFUNCTION & WON!`, ...gameState.log],
            result: {
              won: true,
              title: `${player.name} Wins by Guessing Everything!`,
              reason: `Every player's hand distribution was uniquely determined, and ${player.name} nailed the entire table!`
            }
          };
          applySyncedState(nextState, null, 'MAIN');
        } else {
          const nextState = {
            ...gameState,
            currentTurn: nextTurn,
            turnCount: gameState.turnCount + 1,
            turnNotice: {
              title: `${player.name}'s Guess Wasn't Unique! (Turn Ended)`,
              reason: `While your hand counts were possible, an alternate reality still exists. Play passes to ${gameState.players[nextTurn].name}.`,
              counterExample: alternateWorld
            },
            log: [
              `❌ ${player.name}'s Final Guess wasn't unique — turn passes to ${gameState.players[nextTurn].name}.`,
              ...gameState.log
            ]
          };
          if (gameState.mode === 'passplay') setPassPrivacyScreen(true);
          applySyncedState(nextState, null, 'MAIN');
        }
      };

      const getSuitDisplay = (suitId, suitsList = gameState?.suits || []) => {
        if (suitId < suitsList.length) {
          return `${suitsList[suitId].emoji} ${suitsList[suitId].name}`;
        }
        const unnamedRemaining = (gameState?.numPlayers || 4) - suitsList.length;
        if (unnamedRemaining === 1) {
          return '❔ Final Unnamed Suit';
        }
        return `❔ Unnamed Suit #${suitId - suitsList.length + 1}`;
      };

      // =========================================================================
      // LOBBY VIEW
      // =========================================================================
      if (screen === 'LOBBY') {
        const allLocalNamesFilled = playerNames.every((n) => n.trim().length > 0);
        const onlineReadyToStart =
          onlineRole === 'HOST' &&
          myOnlineName.trim().length > 0 &&
          connectedPeers.length >= playerCount;

        return (
          <div className="min-h-screen flex flex-col">
            <header className="border-b border-slate-800/80 bg-slate-900/60 backdrop-blur px-6 py-4 flex items-center justify-between">
              <div
                onClick={handleLogoClick}
                className="flex items-center gap-3 select-none cursor-default"
              >
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-xl font-bold shadow-lg shadow-indigo-500/20">
                  ⚛️
                </div>
                <div>
                  <h1 className="text-xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300 bg-clip-text text-transparent">
                    Quantum Go Fish
                  </h1>
                  <p className="text-xs text-slate-400">Superposition Deduction Card Game</p>
                </div>
              </div>
              <div className="text-xs text-slate-500 hidden sm:block">
                4 Cards / Suit • 1 Suit / Player
              </div>
            </header>

            <main className="flex-1 max-w-2xl w-full mx-auto p-6 flex flex-col justify-center">
              <div className="bg-slate-900/90 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
                <div>
                  <h2 className="text-2xl font-bold text-white">New Quantum Table</h2>
                  <p className="text-sm text-slate-400 mt-1">
                    No cards have suits until questions collapse reality. Catch opponents in a paradox—or prove your hand!
                  </p>
                </div>

                {/* Play Mode Selector */}
                <div className="space-y-2">
                  <label className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                    Table Mode
                  </label>
                  <div className="grid grid-cols-3 gap-3">
                    {[
                      { id: 'sitaround', label: 'Sit-Around', icon: '⭕', desc: 'Radial tabletop' },
                      { id: 'passplay', label: 'Pass & Play', icon: '📱', desc: 'Single device' },
                      { id: 'online', label: 'Online Room', icon: '🌐', desc: 'Room code sync' }
                    ].map((m) => (
                      <button
                        key={m.id}
                        type="button"
                        onClick={() => {
                          if (mode === 'online' && m.id !== 'online') cleanupOnlineConnections();
                          setMode(m.id);
                        }}
                        className={`p-3 rounded-xl border text-left transition ${
                          mode === m.id
                            ? 'bg-indigo-600/20 border-indigo-500 text-white shadow-lg shadow-indigo-500/10'
                            : 'bg-slate-950/60 border-slate-800 text-slate-400 hover:border-slate-700'
                        }`}
                      >
                        <div className="text-xl mb-1">{m.icon}</div>
                        <div className="font-semibold text-sm">{m.label}</div>
                        <div className="text-[11px] opacity-75">{m.desc}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Player Count */}
                {!(mode === 'online' && onlineRole === 'GUEST') && (
                  <div className="space-y-2">
                    <label className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                      Number of Players ({playerCount} Players = {playerCount} Suits × 4 Cards)
                    </label>
                    <div className="grid grid-cols-4 gap-2">
                      {[3, 4, 5, 6].map((cnt) => (
                        <button
                          key={cnt}
                          type="button"
                          onClick={() => setPlayerCount(cnt)}
                          className={`py-2.5 rounded-xl font-bold text-sm border transition ${
                            playerCount === cnt
                              ? 'bg-purple-600 border-purple-400 text-white'
                              : 'bg-slate-950 border-slate-800 text-slate-400 hover:border-slate-700'
                          }`}
                        >
                          {cnt} Players
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* Local Player Names */}
                {mode !== 'online' && (
                  <div className="space-y-3">
                    <label className="text-xs font-semibold uppercase tracking-wider text-slate-400">
                      Player Names (Required)
                    </label>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {playerNames.map((name, idx) => (
                        <div key={idx} className="relative">
                          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-500">
                            P{idx + 1}
                          </span>
                          <input
                            type="text"
                            value={name}
                            onChange={(e) => {
                              const copy = [...playerNames];
                              copy[idx] = e.target.value;
                              setPlayerNames(copy);
                            }}
                            placeholder="Enter player name..."
                            className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-600 outline-none transition"
                          />
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Online Room Setup */}
                {mode === 'online' && (
                  <div className="space-y-4 bg-slate-950/70 border border-slate-800 rounded-xl p-4">
                    <div className="flex gap-2">
                      <button
                        type="button"
                        onClick={() => {
                          cleanupOnlineConnections();
                          setOnlineRole('HOST');
                        }}
                        className={`flex-1 py-2 rounded-lg text-xs font-bold uppercase tracking-wider ${
                          onlineRole === 'HOST'
                            ? 'bg-indigo-600 text-white'
                            : 'bg-slate-900 text-slate-400'
                        }`}
                      >
                        Host Room
                      </button>
                      <button
                        type="button"
                        onClick={() => {
                          cleanupOnlineConnections();
                          setOnlineRole('GUEST');
                        }}
                        className={`flex-1 py-2 rounded-lg text-xs font-bold uppercase tracking-wider ${
                          onlineRole === 'GUEST'
                            ? 'bg-indigo-600 text-white'
                            : 'bg-slate-900 text-slate-400'
                        }`}
                      >
                        Join Room
                      </button>
                    </div>

                    <div>
                      <label className="text-xs text-slate-400 block mb-1">Your Display Name</label>
                      <input
                        type="text"
                        disabled={onlineRole === 'GUEST' && joinState !== 'IDLE'}
                        value={myOnlineName}
                        onChange={(e) => setMyOnlineName(e.target.value)}
                        placeholder="Enter your name..."
                        className="w-full bg-slate-900 border border-slate-800 focus:border-indigo-500 disabled:opacity-50 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-600 outline-none"
                      />
                    </div>

                    {onlineRole === 'HOST' ? (
                      <div className="space-y-3">
                        {!roomCode ? (
                          <button
                            type="button"
                            disabled={!myOnlineName.trim()}
                            onClick={setupOnlineHost}
                            className="w-full py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 font-semibold text-sm transition"
                          >
                            Generate Room Code
                          </button>
                        ) : (
                          <div className="p-3 bg-slate-900 rounded-xl border border-indigo-500/40 space-y-2">
                            <div className="flex items-center justify-between">
                              <span className="text-xs text-slate-400">Room Code:</span>
                              <span className="text-lg font-mono font-extrabold tracking-widest text-indigo-300">
                                {roomCode}
                              </span>
                            </div>
                            <div className="text-xs text-slate-400">
                              Connected ({connectedPeers.length}/{playerCount}):{' '}
                              <span className="text-slate-200 font-medium">
                                {connectedPeers.map((p) => p.name).join(', ')}
                              </span>
                            </div>
                          </div>
                        )}
                      </div>
                    ) : (
                      <div className="space-y-3">
                        <div className="flex gap-2">
                          <input
                            type="text"
                            maxLength={4}
                            disabled={joinState !== 'IDLE'}
                            value={joinCodeInput}
                            onChange={(e) => setJoinCodeInput(e.target.value.toUpperCase())}
                            placeholder="4-LETTER CODE"
                            className="flex-1 bg-slate-900 border border-slate-800 focus:border-indigo-500 disabled:opacity-50 rounded-xl px-4 py-2.5 text-sm font-mono uppercase tracking-widest text-white placeholder-slate-600 outline-none"
                          />
                          <button
                            type="button"
                            disabled={
                              joinState !== 'IDLE' ||
                              !myOnlineName.trim() ||
                              joinCodeInput.trim().length < 4
                            }
                            onClick={joinOnlineRoom}
                            className="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed font-semibold text-sm transition"
                          >
                            {joinState === 'CONNECTING'
                              ? 'Joining...'
                              : joinState === 'JOINED'
                              ? 'Joined'
                              : 'Join'}
                          </button>
                        </div>
                        {connectedPeers.length > 0 && (
                          <div className="text-xs text-slate-400">
                            Room Players ({connectedPeers.length}/{playerCount}):{' '}
                            <span className="text-slate-200 font-medium">
                              {connectedPeers.map((p) => p.name).join(', ')}
                            </span>
                          </div>
                        )}
                      </div>
                    )}

                    {onlineStatus && (
                      <p className="text-xs text-indigo-300 bg-indigo-950/50 border border-indigo-500/30 rounded-lg px-3 py-2">
                        {onlineStatus}
                      </p>
                    )}
                  </div>
                )}

                {/* Start Button */}
                {!(mode === 'online' && onlineRole === 'GUEST') && (
                  <button
                    type="button"
                    disabled={mode === 'online' ? !onlineReadyToStart : !allLocalNamesFilled}
                    onClick={handleStartGame}
                    className="w-full py-3.5 rounded-xl bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 disabled:opacity-40 disabled:cursor-not-allowed font-bold text-white shadow-lg shadow-indigo-600/25 transition"
                  >
                    {mode === 'online'
                      ? onlineReadyToStart
                        ? 'Start Online Quantum Match'
                        : `Waiting for ${playerCount - connectedPeers.length} more player(s)...`
                      : 'Deal Quantum Hands'}
                  </button>
                )}
              </div>
            </main>
          </div>
        );
      }

      // =========================================================================
      // GAME VIEW
      // =========================================================================
      const activeActorIdx = pendingAsk ? pendingAsk.target : gameState.currentTurn;
      const activeActor = gameState.players[activeActorIdx];
      const isMyTurnOnline = gameState.mode !== 'online' || mySeatIndex === activeActorIdx;

      const currentPlayerCards = gameState.cards.filter((c) => c.owner === gameState.currentTurn);
      const canClaimVictory =
        currentPlayerCards.length >= 4 && gameState.suits.length > 0;
      const mustGuessOnly = currentPlayerCards.length === 0;

      // Used emojis across existing suits; any unused emoji is allowed
      const usedEmojis = new Set(gameState.suits.map((s) => s.emoji));
      const availableQuickEmojis = QUICK_EMOJIS.filter((e) => !usedEmojis.has(e));
      const parsedCustomEmoji = extractFirstGrapheme(newSuitEmoji);
      const isEmojiUnique = parsedCustomEmoji.length > 0 && !usedEmojis.has(parsedCustomEmoji);

      // Render a single face-down quantum card (with flip animation support)
      const renderCard = (card, small = false) => {
        const rev = gameState.revealingCards;
        const isRevealing = rev && rev.cardIds.includes(card.id);

        return (
          <div
            key={card.id}
            className={`relative perspective-1000 select-none transition-all duration-500 ${
              small ? 'w-10 h-14' : 'w-14 h-20 sm:w-16 sm:h-24'
            }`}
          >
            <div
              className={`w-full h-full transition-transform duration-700 transform-style-3d ${
                isRevealing ? 'rotate-y-180 scale-110' : ''
              }`}
            >
              <div className="absolute inset-0 backface-hidden rounded-xl bg-gradient-to-br from-indigo-900 via-slate-900 to-purple-950 border border-indigo-400/40 shadow-md flex flex-col items-center justify-center">
                <span className={small ? 'text-xs' : 'text-lg'}>⚛️</span>
                <span className="text-[9px] font-mono text-indigo-300/70 mt-0.5">#{card.id + 1}</span>
              </div>

              <div className="absolute inset-0 backface-hidden rotate-y-180 rounded-xl bg-gradient-to-br from-amber-500 to-pink-600 border-2 border-white shadow-xl flex flex-col items-center justify-center p-1 text-center">
                <span className={small ? 'text-base' : 'text-2xl'}>
                  {rev ? rev.suitEmoji : '✨'}
                </span>
                {!small && rev && (
                  <span className="text-[9px] font-bold text-white leading-tight mt-1 truncate w-full">
                    {rev.suitName}
                  </span>
                )}
              </div>
            </div>
          </div>
        );
      };

      const renderCounterExampleGrid = (counterExample) => (
        <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-4 space-y-3">
          <h3 className="text-xs font-bold uppercase tracking-wider text-indigo-300">
            Valid Counter-Example Reality (Follows Every Rule & Answer):
          </h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {gameState.players.map((p) => {
              const pCards = gameState.cards.filter((c) => c.owner === p.id);
              return (
                <div
                  key={p.id}
                  className="p-3 rounded-xl bg-slate-900 border border-slate-800"
                >
                  <div className="font-bold text-sm text-white mb-1.5">{p.name}</div>
                  {pCards.length === 0 ? (
                    <span className="text-xs text-slate-500 italic">0 cards</span>
                  ) : (
                    <div className="flex flex-wrap gap-1.5">
                      {pCards.map((c) => {
                        const sId = counterExample[c.id];
                        return (
                          <span
                            key={c.id}
                            className="px-2 py-1 rounded-lg bg-slate-800 text-xs text-slate-200"
                          >
                            #{c.id + 1}: {getSuitDisplay(sId)}
                          </span>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      );

      const renderSitAroundTable = () => {
        const n = gameState.numPlayers;
        return (
          <div className="relative w-full max-w-3xl aspect-square max-h-[430px] mx-auto my-2 flex items-center justify-center">
            <div className="absolute inset-8 sm:inset-12 rounded-full border-2 border-dashed border-indigo-500/25 bg-slate-900/40 flex items-center justify-center">
              <div className="text-center px-4">
                <div className="text-xs uppercase tracking-widest text-indigo-400 font-bold">
                  Turn {gameState.turnCount}
                </div>
                <div className="text-sm sm:text-base font-bold text-white mt-0.5">
                  {pendingAsk
                    ? `${gameState.players[pendingAsk.target].name} Answering...`
                    : `${gameState.players[gameState.currentTurn].name}'s Turn`}
                </div>
                <div className="text-[11px] text-slate-400 mt-1">
                  {gameState.suits.length}/{gameState.numPlayers} Suits Discovered
                </div>
              </div>
            </div>

            {gameState.players.map((p, idx) => {
              const angle = (idx / n) * 2 * Math.PI - Math.PI / 2;
              const radiusPct = 41;
              const left = 50 + radiusPct * Math.cos(angle);
              const top = 50 + radiusPct * Math.sin(angle);
              const pCards = gameState.cards.filter((c) => c.owner === idx);
              const isTurn = activeActorIdx === idx && gameState.status === 'PLAYING';

              return (
                <div
                  key={p.id}
                  style={{ left: `${left}%`, top: `${top}%` }}
                  className={`-translate-x-1/2 -translate-y-1/2 absolute p-2.5 sm:p-3 rounded-2xl border backdrop-blur transition-all ${
                    isTurn
                      ? 'bg-indigo-950/90 border-indigo-400 shadow-lg shadow-indigo-500/25 scale-105 z-10'
                      : 'bg-slate-900/85 border-slate-800'
                  }`}
                >
                  <div className="flex items-center justify-between gap-2 mb-1.5">
                    <span className="font-bold text-xs sm:text-sm text-white truncate max-w-[100px]">
                      {p.name}
                    </span>
                    <span className="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-indigo-300">
                      {pCards.length}🃏
                    </span>
                  </div>
                  <div className="flex gap-1 justify-center flex-wrap max-w-[185px]">
                    {pCards.length === 0 ? (
                      <span className="text-[11px] text-slate-500 italic py-2">0 cards</span>
                    ) : (
                      pCards.map((c) => renderCard(c, true))
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        );
      };

      const renderFocusedTable = () => {
        const focusSeat =
          gameState.mode === 'online' ? mySeatIndex : activeActorIdx;
        const focusPlayer = gameState.players[focusSeat];
        const myCards = gameState.cards.filter((c) => c.owner === focusSeat);
        const opponents = gameState.players.filter((p) => p.id !== focusSeat);

        return (
          <div className="max-w-4xl w-full mx-auto space-y-6 my-2">
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
              {opponents.map((opp) => {
                const oppCards = gameState.cards.filter((c) => c.owner === opp.id);
                const isOppActive = activeActorIdx === opp.id && gameState.status === 'PLAYING';
                return (
                  <div
                    key={opp.id}
                    className={`p-3 rounded-2xl border transition ${
                      isOppActive
                        ? 'bg-indigo-950/80 border-indigo-400 shadow-lg shadow-indigo-500/20'
                        : 'bg-slate-900/80 border-slate-800'
                    }`}
                  >
                    <div className="flex items-center justify-between mb-2">
                      <span className="font-bold text-sm text-white truncate">{opp.name}</span>
                      <span className="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 text-indigo-300">
                        {oppCards.length} cards
                      </span>
                    </div>
                    <div className="flex gap-1.5 flex-wrap">
                      {oppCards.length === 0 ? (
                        <span className="text-xs text-slate-500 italic">No cards</span>
                      ) : (
                        oppCards.map((c) => renderCard(c, true))
                      )}
                    </div>
                  </div>
                );
              })}
            </div>

            <div
              className={`p-5 rounded-2xl border text-center transition ${
                activeActorIdx === focusSeat && gameState.status === 'PLAYING'
                  ? 'bg-gradient-to-b from-indigo-950/70 to-slate-900 border-indigo-500 shadow-xl'
                  : 'bg-slate-900/90 border-slate-800'
              }`}
            >
              <div className="text-xs uppercase tracking-wider text-indigo-400 font-bold mb-1">
                {gameState.mode === 'online' ? 'Your Hand' : 'Active Hand'}
              </div>
              <h3 className="text-xl font-extrabold text-white mb-4">
                {focusPlayer.name}{' '}
                <span className="text-sm font-normal text-slate-400">
                  ({myCards.length} {myCards.length === 1 ? 'card' : 'cards'})
                </span>
              </h3>
              <div className="flex justify-center gap-3 flex-wrap">
                {myCards.length === 0 ? (
                  <p className="text-sm text-slate-400 italic py-4">
                    You have 0 cards! Your only option on your turn is to Guess Everything.
                  </p>
                ) : (
                  myCards.map((c) => renderCard(c, false))
                )}
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen flex flex-col relative">
          {/* Temporary Floating Move Banner (Exact Log Text) */}
          {moveBanner && (
            <div
              key={moveBanner.id}
              onClick={() => setMoveBanner(null)}
              className="banner-pop fixed top-16 left-1/2 z-40 w-[92%] max-w-2xl bg-slate-900/95 border border-indigo-400/80 shadow-2xl shadow-indigo-950/80 backdrop-blur-md rounded-2xl px-5 py-3.5 flex items-center justify-between gap-3 cursor-pointer"
            >
              <p className="text-xs sm:text-sm font-semibold text-white leading-snug">
                {moveBanner.text}
              </p>
              <span className="text-[11px] text-indigo-300 shrink-0 font-bold">✕</span>
            </div>
          )}

          {/* Top Bar with Invisible Logo Secret Trigger */}
          <header className="border-b border-slate-800/80 bg-slate-900/80 backdrop-blur px-4 sm:px-6 py-3 flex items-center justify-between sticky top-0 z-30">
            <div
              onClick={handleLogoClick}
              className="flex items-center gap-2.5 select-none cursor-default"
            >
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-base font-bold">
                ⚛️
              </div>
              <div>
                <h1 className="text-base sm:text-lg font-extrabold bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300 bg-clip-text text-transparent">
                  Quantum Go Fish
                </h1>
              </div>
            </div>

            {/* Discovered Suits Bar */}
            <div className="flex items-center gap-2 flex-wrap justify-end">
              {gameState.suits.map((s) => (
                <span
                  key={s.id}
                  className="px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700 text-xs font-medium text-slate-200"
                >
                  {s.emoji} {s.name}
                </span>
              ))}
              {gameState.suits.length < gameState.numPlayers && (
                <span className="px-2.5 py-1 rounded-full bg-slate-900 border border-dashed border-slate-700 text-xs text-slate-500">
                  +{gameState.numPlayers - gameState.suits.length} Unknown Suit(s)
                </span>
              )}
              <button
                type="button"
                onClick={() => {
                  setScreen('LOBBY');
                  setGameState(null);
                  setPendingAsk(null);
                  setActionPanel('MAIN');
                  setMoveBanner(null);
                }}
                className="ml-2 px-3 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 font-semibold"
              >
                Exit
              </button>
            </div>
          </header>

          {/* Pass & Play Device Handoff Privacy Curtain */}
          {gameState.mode === 'passplay' && passPrivacyScreen && gameState.status === 'PLAYING' ? (
            <main className="flex-1 flex items-center justify-center p-6">
              <div className="max-w-md w-full bg-slate-900 border border-indigo-500/40 rounded-2xl p-8 text-center shadow-2xl space-y-5">
                {gameState.turnNotice && (
                  <div className="p-3.5 rounded-xl bg-amber-950/60 border border-amber-500/50 text-left space-y-1">
                    <div className="text-xs font-bold text-amber-300">{gameState.turnNotice.title}</div>
                    <div className="text-xs text-slate-200">{gameState.turnNotice.reason}</div>
                  </div>
                )}
                <div className="text-4xl">🔄</div>
                <h2 className="text-2xl font-extrabold text-white">
                  Pass Device to {activeActor.name}
                </h2>
                <p className="text-sm text-slate-400">
                  {pendingAsk
                    ? `${gameState.players[pendingAsk.asker].name} asked ${activeActor.name} for ${pendingAsk.suitEmoji} ${pendingAsk.suitName}.`
                    : `It is now ${activeActor.name}'s turn to act.`}
                </p>
                <button
                  type="button"
                  onClick={() => setPassPrivacyScreen(false)}
                  className="w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-white shadow-lg transition"
                >
                  I am {activeActor.name} — Ready
                </button>
              </div>
            </main>
          ) : (
            <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-4">
              {/* Turn Notice Banner */}
              {gameState.status === 'PLAYING' && gameState.turnNotice && (
                <div className="rounded-2xl border border-amber-500/70 bg-amber-950/50 p-5 shadow-xl space-y-3">
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex items-start gap-3">
                      <span className="text-2xl">⚖️</span>
                      <div>
                        <h3 className="text-base sm:text-lg font-extrabold text-amber-300">
                          {gameState.turnNotice.title}
                        </h3>
                        <p className="text-xs sm:text-sm text-slate-200 mt-0.5">
                          {gameState.turnNotice.reason}
                        </p>
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={() =>
                        applySyncedState(
                          { ...gameState, turnNotice: null },
                          pendingAsk,
                          actionPanel
                        )
                      }
                      className="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-300 shrink-0"
                    >
                      Dismiss
                    </button>
                  </div>
                  {gameState.turnNotice.counterExample &&
                    renderCounterExampleGrid(gameState.turnNotice.counterExample)}
                </div>
              )}

              {/* Board Area */}
              {gameState.mode === 'sitaround' ? renderSitAroundTable() : renderFocusedTable()}

              {/* Game Over Banner */}
              {gameState.status === 'GAME_OVER' && gameState.result && (
                <div
                  className={`rounded-2xl border p-6 shadow-2xl space-y-4 ${
                    gameState.result.won
                      ? 'bg-emerald-950/70 border-emerald-500'
